<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kindle Smart Dashboard</title>
<style>
  /* Reset & Tối ưu hóa hiển thị sắc nét cho màn hình E-Ink */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  
  body {
    background-color: #FFFFFF;
    color: #000000;
    font-family: "Bookerly", "Georgia", "Times New Roman", serif;
    padding: 12px;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  /* KỸ THUẬT ĐẢO MÀU CHỐNG LƯU ẢNH (GHOSTING) CHO E-INK */
  body.eink-refresh,
  body.eink-refresh * {
    background-color: #000000 !important;
    color: #FFFFFF !important;
    border-color: #FFFFFF !important;
  }

  body.eink-refresh .today {
    background-color: #FFFFFF !important;
    color: #000000 !important;
  }

  body.eink-refresh .today span {
    background-color: #FFFFFF !important;
    color: #000000 !important;
  }

  .container {
    border: 3px solid #000000;
    padding: 12px 16px;
  }

  /* 1. Phần Thời gian & Ngày tháng (Dương + Âm) */
  .time-section {
    text-align: center;
    border-bottom: 3px solid #000000;
    padding-bottom: 12px;
    margin-bottom: 12px;
    cursor: pointer;
  }

  .clock {
    font-family: "Helvetica Neue", "Arial", sans-serif;
    font-size: 78px;
    font-weight: bold;
    letter-spacing: 3px;
    line-height: 1;
  }

  .date {
    font-size: 18px;
    font-weight: bold;
    text-transform: uppercase;
    margin-top: 6px;
    letter-spacing: 1px;
  }

  .lunar-header {
    font-size: 15px;
    font-style: italic;
    margin-top: 4px;
  }

  /* 2. Phần Thời tiết hiện tại & Lịch tháng */
  .middle-section {
    display: table;
    width: 100%;
    border-bottom: 3px solid #000000;
    padding-bottom: 12px;
    margin-bottom: 12px;
  }

  .col-weather, .col-calendar {
    display: table-cell;
    vertical-align: top;
  }

  .col-weather {
    width: 42%;
    border-right: 2px solid #000000;
    padding-right: 12px;
    text-align: center;
    cursor: pointer;
  }

  .col-calendar {
    width: 58%;
    padding-left: 12px;
  }

  .section-title {
    font-family: "Helvetica Neue", "Arial", sans-serif;
    font-size: 14px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
    text-align: center;
    border-bottom: 2px solid #000000;
    padding-bottom: 4px;
  }

  /* Chi tiết Thời tiết hiện tại */
  .weather-icon {
    font-size: 42px;
    line-height: 1.1;
    margin: 4px 0;
  }

  .weather-temp {
    font-family: "Helvetica Neue", "Arial", sans-serif;
    font-size: 36px;
    font-weight: bold;
  }

  .weather-desc {
    font-size: 15px;
    font-weight: bold;
    margin: 4px 0 8px 0;
  }

  .weather-details {
    font-family: "Helvetica Neue", "Arial", sans-serif;
    font-size: 13px;
    text-align: left;
    border-top: 1px dashed #000000;
    padding-top: 6px;
    line-height: 1.5;
  }

  .update-status {
    font-size: 11px;
    font-style: italic;
    margin-top: 6px;
    text-align: center;
  }

  /* Chi tiết Bảng Lịch tháng (Dương + Âm) */
  .calendar-table {
    width: 100%;
    border-collapse: collapse;
    font-family: "Helvetica Neue", "Arial", sans-serif;
    text-align: center;
    table-layout: fixed;
  }

  .calendar-table th {
    padding: 4px 1px;
    border-bottom: 1px solid #000000;
    font-size: 12px;
    font-weight: bold;
  }

  .calendar-table td {
    padding: 3px 1px;
    vertical-align: middle;
  }

  .solar-num {
    display: block;
    font-size: 14px;
    font-weight: bold;
    line-height: 1.1;
  }

  .lunar-num {
    display: block;
    font-size: 10px;
    line-height: 1.1;
    margin-top: 1px;
  }

  .lunar-special {
    font-weight: bold;
    text-decoration: underline;
  }

  .today {
    background-color: #000000;
    color: #FFFFFF;
    border-radius: 3px;
  }

  /* 3. Phần Dự báo 4 ngày tới */
  .forecast-section {
    border-bottom: 3px solid #000000;
    padding-bottom: 12px;
    margin-bottom: 12px;
  }

  .forecast-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    text-align: center;
    font-family: "Helvetica Neue", "Arial", sans-serif;
  }

  .forecast-table td {
    border-right: 1px dashed #000000;
    padding: 3px 6px;
    vertical-align: top;
  }

  .forecast-table td:last-child {
    border-right: none;
  }

  .f-day {
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    margin-bottom: 3px;
  }

  .f-icon {
    font-size: 24px;
    line-height: 1.1;
    margin: 3px 0;
  }

  .f-temp {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 2px;
  }

  .f-temp-min {
    font-weight: normal;
  }

  .f-rain {
    font-size: 11px;
  }

  /* 4. Phần Câu nói truyền cảm hứng (API) */
  .quote-section {
    text-align: center;
    padding: 2px 8px;
    cursor: pointer;
    min-height: 75px;
  }

  .quote-text {
    font-size: 17px;
    font-style: italic;
    line-height: 1.35;
    margin-bottom: 6px;
  }

  .quote-author {
    font-family: "Helvetica Neue", "Arial", sans-serif;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .quote-hint {
    font-family: "Helvetica Neue", "Arial", sans-serif;
    font-size: 10px;
    margin-top: 4px;
    font-style: italic;
  }
</style>
</head>
<body>

<div class="container">
  <!-- 1. Khu vực Thời gian & Ngày Âm Dương -->
  <div class="time-section" onclick="refreshEInkScreen()">
    <div id="clock" class="clock">00:00</div>
    <div id="date" class="date">ĐANG TẢI...</div>
    <div id="lunar-date" class="lunar-header">Âm lịch: ...</div>
  </div>

  <!-- 2. Khu vực Thời tiết hiện tại & Lịch -->
  <div class="middle-section">
    <!-- Cột Thời tiết -->
    <div class="col-weather" onclick="fetchWeatherAndForecast()">
      <div class="section-title" id="location-name">ĐỒNG NAI</div>
      <div id="w-icon" class="weather-icon">☀</div>
      <div id="w-temp" class="weather-temp">--°C</div>
      <div id="w-desc" class="weather-desc">Đang kết nối...</div>
      <div class="weather-details">
        <div><strong>Cảm giác:</strong> <span id="w-feel">--°C</span></div>
        <div><strong>Độ ẩm:</strong> <span id="w-hum">--%</span> | <strong>Gió:</strong> <span id="w-wind">--</span></div>
      </div>
      <div id="w-status" class="update-status">Cập nhật: --:--</div>
    </div>

    <!-- Cột Lịch tháng (Kèm ngày Âm) -->
    <div class="col-calendar">
      <div id="cal-title" class="section-title">THÁNG -- / ----</div>
      <table class="calendar-table">
        <thead>
          <tr>
            <th>T2</th><th>T3</th><th>T4</th><th>T5</th><th>T6</th><th>T7</th><th>CN</th>
          </tr>
        </thead>
        <tbody id="cal-body"></tbody>
      </table>
    </div>
  </div>

  <!-- 3. Khu vực Dự báo thời tiết 4 ngày tới -->
  <div class="forecast-section">
    <div class="section-title">DỰ BÁO 4 NGÀY TỚI</div>
    <table class="forecast-table">
      <tr id="forecast-row">
        <td>Đang tải dữ liệu dự báo...</td>
      </tr>
    </table>
  </div>

  <!-- 4. Khu vực Câu nói truyền cảm hứng -->
  <div class="quote-section" onclick="updateQuote()">
    <div id="quote-text" class="quote-text">“Đang tải câu nói truyền cảm hứng...”</div>
    <div id="quote-author" class="quote-author">— ... —</div>
    <div class="quote-hint">(Chạm câu nói để đổi mới • Chạm đồng hồ để làm sạch mực E-Ink)</div>
  </div>
</div>

<script>
  // =========================================================================
  // CẤU HÌNH CÁ NHÂN HÓA
  // =========================================================================
  var LOCATION_NAME = "ĐỒNG NAI";
  var LAT = 10.95; 
  var LON = 106.82;
  var AUTO_TRANSLATE_TO_VI = true;

  var fallbackQuotes = [
    { text: "Hành trình vạn dặm luôn bắt đầu từ một bước chân.", author: "Lão Tử" },
    { text: "Đọc sách không bằng suy ngẫm, học trường không bằng học đời.", author: "Khuyết danh" },
    { text: "Sự giản dị là tột cùng của sự tinh tế.", author: "Leonardo da Vinci" },
    { text: "Kỷ luật là cầu nối giữa mục tiêu và thành tựu.", author: "Jim Rohn" },
    { text: "Chúng ta là những gì chúng ta lặp đi lặp lại mỗi ngày.", author: "Aristotle" },
    { text: "Đừng đếm ngày tháng, hãy làm cho ngày tháng trở nên đáng nhớ.", author: "Muhammad Ali" },
    { text: "Thời gian của bạn có hạn, đừng lãng phí nó để sống cuộc đời của người khác.", author: "Steve Jobs" },
    { text: "Sách là giấc mơ mà bạn cầm trên tay.", author: "Neil Gaiman" },
    { text: "Tri thức là sức mạnh.", author: "Francis Bacon" }
  ];

  // =========================================================================
  // THUẬT TOÁN TÍNH ÂM LỊCH VIỆT NAM (GMT+7) - HỒ NGỌC ĐỨC
  // =========================================================================
  var CAN = ["Giáp", "Ất", "Bính", "Đinh", "Mậu", "Kỷ", "Canh", "Tân", "Nhâm", "Quý"];
  var CHI = ["Tý", "Sửu", "Dần", "Mão", "Thìn", "Tỵ", "Ngọ", "Mùi", "Thân", "Dậu", "Tuất", "Hợi"];

  function INT(d) {
    return Math.floor(d);
  }

  function jdFromDate(dd, mm, yy) {
    var a = INT((14 - mm) / 12);
    var y = yy + 4800 - a;
    var m = mm + 12 * a - 3;
    var jd = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - INT(y / 100) + INT(y / 400) - 32045;
    if (jd < 2299161) {
      jd = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - 32083;
    }
    return jd;
  }

  function getNewMoonDay(k, timeZone) {
    var T = k / 1236.85;
    var T2 = T * T;
    var T3 = T2 * T;
    var dr = Math.PI / 180;
    var Jd1 = 2415020.75933 + 29.53058868 * k + 0.0001178 * T2 - 0.000000155 * T3;
    Jd1 = Jd1 + 0.00033 * Math.sin((166.56 + 132.87 * T - 0.009173 * T2) * dr);
    var M = 359.2242 + 29.10535608 * k - 0.0000333 * T2 - 0.00000347 * T3;
    var Mpr = 306.0253 + 385.81691806 * k + 0.0107306 * T2 + 0.00001236 * T3;
    var F = 21.2964 + 390.67050646 * k - 0.0016528 * T2 - 0.00000239 * T3;
    var C1 = (0.1734 - 0.000393 * T) * Math.sin(M * dr) + 0.0021 * Math.sin(2 * dr * M);
    C1 = C1 - 0.4068 * Math.sin(Mpr * dr) + 0.0161 * Math.sin(dr * 2 * Mpr);
    C1 = C1 - 0.0004 * Math.sin(dr * 3 * Mpr);
    C1 = C1 + 0.0104 * Math.sin(dr * 2 * F) - 0.0051 * Math.sin(dr * (M + Mpr));
    C1 = C1 - 0.0074 * Math.sin(dr * (M - Mpr)) + 0.0004 * Math.sin(dr * (2 * F + M));
    C1 = C1 - 0.0004 * Math.sin(dr * (2 * F - M)) - 0.0006 * Math.sin(dr * (2 * F + Mpr));
    C1 = C1 + 0.0010 * Math.sin(dr * (2 * F - Mpr)) + 0.0005 * Math.sin(dr * (2 * Mpr + M));
    var deltat;
    if (T < -11) {
      deltat = 0.001 + 0.000839 * T + 0.0002261 * T2 - 0.00000845 * T3 - 0.000000081 * T * T3;
    } else {
      deltat = -0.000278 + 0.000265 * T + 0.000262 * T2;
    }
    var JdNew = Jd1 + C1 - deltat;
    return INT(JdNew + 0.5 + timeZone / 24);
  }

  function getSunLongitude(jdn, timeZone) {
    var T = (jdn - 2451545.5 - timeZone / 24) / 36525;
    var T2 = T * T;
    var dr = Math.PI / 180;
    var M = 357.52910 + 35999.05030 * T - 0.0001559 * T2 - 0.00000048 * T * T2;
    var L0 = 280.46645 + 36000.76983 * T + 0.0003032 * T2;
    var DL = (1.914600 - 0.004817 * T - 0.000014 * T2) * Math.sin(dr * M);
    DL = DL + (0.019993 - 0.000101 * T) * Math.sin(dr * 2 * M) + 0.000290 * Math.sin(dr * 3 * M);
    var L = L0 + DL;
    L = L * dr;
    L = L - Math.PI * 2 * (INT(L / (Math.PI * 2)));
    return INT(L / Math.PI * 6);
  }

  function getLunarMonth11(yy, timeZone) {
    var off = jdFromDate(31, 12, yy) - 2415021;
    var k = INT(off / 29.530588853);
    var nm = getNewMoonDay(k, timeZone);
    var sunLong = getSunLongitude(nm, timeZone);
    if (sunLong >= 9) {
      nm = getNewMoonDay(k - 1, timeZone);
    }
    return nm;
  }

  function getLeapMonthOffset(a11, timeZone) {
    var k = INT((a11 - 2415021.076998695) / 29.530588853 + 0.5);
    var last = 0;
    var i = 1;
    var arc = getSunLongitude(getNewMoonDay(k + i, timeZone), timeZone);
    do {
      last = arc;
      i++;
      arc = getSunLongitude(getNewMoonDay(k + i, timeZone), timeZone);
    } while (arc != last && i < 14);
    return i - 1;
  }

  // Trả về mảng [Ngày Âm, Tháng Âm, Năm Âm, Nhuận (0/1), JulianDay]
  function convertSolar2Lunar(dd, mm, yy) {
    var timeZone = 7; // Múi giờ Việt Nam GMT+7
    var dayNumber = jdFromDate(dd, mm, yy);
    var k = INT((dayNumber - 2415021.076998695) / 29.530588853);
    var monthStart = getNewMoonDay(k + 1, timeZone);
    if (monthStart > dayNumber) {
      monthStart = getNewMoonDay(k, timeZone);
    }
    var a11 = getLunarMonth11(yy, timeZone);
    var b11 = a11;
    var lunarYear;
    if (a11 >= monthStart) {
      lunarYear = yy;
      a11 = getLunarMonth11(yy - 1, timeZone);
    } else {
      lunarYear = yy + 1;
      b11 = getLunarMonth11(yy + 1, timeZone);
    }
    var lunarDay = dayNumber - monthStart + 1;
    var diff = INT((monthStart - a11) / 29);
    var lunarLeap = 0;
    var lunarMonth = diff + 11;
    if (b11 - a11 > 365) {
      var leapMonthDiff = getLeapMonthOffset(a11, timeZone);
      if (diff >= leapMonthDiff) {
        lunarMonth = diff + 10;
        if (diff == leapMonthDiff) {
          lunarLeap = 1;
        }
      }
    }
    if (lunarMonth > 12) {
      lunarMonth = lunarMonth - 12;
    }
    if (lunarMonth >= 11 && diff < 4) {
      lunarYear -= 1;
    }
    return [lunarDay, lunarMonth, lunarYear, lunarLeap, dayNumber];
  }

  function getCanChiYear(lunarYear) {
    return CAN[(lunarYear + 6) % 10] + " " + CHI[(lunarYear + 8) % 12];
  }

  function getCanChiDay(jd) {
    return CAN[(jd + 9) % 10] + " " + CHI[(jd + 1) % 12];
  }

  // =========================================================================
  // HÀM KHỬ LƯU ẢNH (GHOSTING) TRÊN MÀN HÌNH E-INK
  // =========================================================================
  function refreshEInkScreen() {
    document.body.className = "eink-refresh";
    setTimeout(function() {
      document.body.className = "";
    }, 500);
  }

  // =========================================================================
  // 1. ĐỒNG HỒ & NGÀY THÁNG (DƯƠNG LỊCH + ÂM LỊCH)
  // =========================================================================
  function updateTime() {
    var now = new Date();
    var hours = now.getHours();
    var minutes = now.getMinutes();
    
    var hStr = (hours < 10 ? "0" : "") + hours;
    var mStr = (minutes < 10 ? "0" : "") + minutes;
    document.getElementById("clock").innerHTML = hStr + ":" + mStr;

    var d = now.getDate();
    var m = now.getMonth() + 1;
    var y = now.getFullYear();

    var days = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
    var dateStr = days[now.getDay()] + ", " + d + " Tháng " + m + ", " + y;
    document.getElementById("date").innerHTML = dateStr;

    // Tính ngày Âm lịch hôm nay
    var lunar = convertSolar2Lunar(d, m, y);
    var lDayStr = (lunar[0] <= 10) ? ("Mùng " + lunar[0]) : lunar[0];
    var lMonthStr = lunar[1] + (lunar[3] === 1 ? " Nhuận" : "");
    var canChiYear = getCanChiYear(lunar[2]);
    var canChiDay = getCanChiDay(lunar[4]);

    document.getElementById("lunar-date").innerHTML = 
      "Âm lịch: <strong>" + lDayStr + " tháng " + lMonthStr + " năm " + canChiYear + "</strong> (Ngày " + canChiDay + ")";
  }

  // =========================================================================
  // 2. BẢNG LỊCH THÁNG (TÍCH HỢP NGÀY ÂM NHỎ BÊN DƯỚI)
  // =========================================================================
  function generateCalendar() {
    var now = new Date();
    var year = now.getFullYear();
    var month = now.getMonth();
    var today = now.getDate();

    document.getElementById("cal-title").innerHTML = "THÁNG " + (month + 1) + " / " + year;

    var firstDay = new Date(year, month, 1).getDay();
    var startOffset = (firstDay === 0) ? 6 : firstDay - 1;
    var daysInMonth = new Date(year, month + 1, 0).getDate();

    var html = "";
    var dayCount = 1;

    for (var row = 0; row < 6; row++) {
      html += "<tr>";
      for (var col = 0; col < 7; col++) {
        if ((row === 0 && col < startOffset) || dayCount > daysInMonth) {
          html += "<td></td>";
        } else {
          var classToday = (dayCount === today) ? " class='today'" : "";
          
          // Tính ngày Âm cho từng ô trong lịch
          var lDate = convertSolar2Lunar(dayCount, month + 1, year);
          var lDay = lDate[0];
          var lMonth = lDate[1];
          
          // Nếu là Mùng 1 hoặc Rằm (15) thì hiển thị kèm tháng và gạch chân nổi bật
          var lunarDisplay = (lDay === 1 || dayCount === 1) ? (lDay + "/" + lMonth) : lDay;
          var specialClass = (lDay === 1 || lDay === 15) ? " lunar-special" : "";

          html += "<td" + classToday + ">"
                + "<span class='solar-num'>" + dayCount + "</span>"
                + "<span class='lunar-num" + specialClass + "'>" + lunarDisplay + "</span>"
                + "</td>";
          dayCount++;
        }
      }
      html += "</tr>";
      if (dayCount > daysInMonth) break;
    }
    document.getElementById("cal-body").innerHTML = html;
  }

  // =========================================================================
  // 3. API CÂU NÓI TRUYỀN CẢM HỨNG
  // =========================================================================
  function updateQuote() {
    var apiUrl = "https://dummyjson.com/quotes/random";
    var xhr = new XMLHttpRequest();
    xhr.open("GET", apiUrl + "?t=" + new Date().getTime(), true);
    xhr.timeout = 10000;

    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            var enQuote = data.quote;
            var author = data.author;

            if (AUTO_TRANSLATE_TO_VI) {
              translateQuoteToVietnamese(enQuote, author);
            } else {
              renderQuoteOnScreen(enQuote, author);
            }
          } catch (e) {
            useFallbackQuote();
          }
        } else {
          useFallbackQuote();
        }
      }
    };
    xhr.send();
  }

  function translateQuoteToVietnamese(enText, author) {
    var transUrl = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(enText) + "&langpair=en|vi";
    var xhr = new XMLHttpRequest();
    xhr.open("GET", transUrl, true);
    xhr.timeout = 10000;

    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          try {
            var res = JSON.parse(xhr.responseText);
            var viText = res.responseData.translatedText;
            if (viText && viText.indexOf("MYMEMORY WARNING") === -1) {
              renderQuoteOnScreen(viText, author);
            } else {
              renderQuoteOnScreen(enText, author);
            }
          } catch (e) {
            renderQuoteOnScreen(enText, author);
          }
        } else {
          renderQuoteOnScreen(enText, author);
        }
      }
    };
    xhr.send();
  }

  function renderQuoteOnScreen(text, author) {
    var quoteEl = document.getElementById("quote-text");
    var authorEl = document.getElementById("quote-author");

    if (text.length > 150) {
      quoteEl.style.fontSize = "14px";
    } else if (text.length > 100) {
      quoteEl.style.fontSize = "15px";
    } else {
      quoteEl.style.fontSize = "17px";
    }

    quoteEl.innerHTML = "“" + text + "”";
    authorEl.innerHTML = "— " + author + " —";
  }

  function useFallbackQuote() {
    var randomIndex = Math.floor(Math.random() * fallbackQuotes.length);
    renderQuoteOnScreen(fallbackQuotes[randomIndex].text, fallbackQuotes[randomIndex].author);
  }

  // =========================================================================
  // 4. API THỜI TIẾT HIỆN TẠI & DỰ BÁO 4 NGÀY
  // =========================================================================
  function fetchWeatherAndForecast() {
    document.getElementById("location-name").innerHTML = LOCATION_NAME;
    
    var url = "https://api.open-meteo.com/v1/forecast"
            + "?latitude=" + LAT + "&longitude=" + LON
            + "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m"
            + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"
            + "&timezone=auto&forecast_days=5";
    
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.timeout = 15000;

    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            renderCurrentWeather(data.current);
            renderForecast(data.daily);
            
            var now = new Date();
            var h = (now.getHours() < 10 ? "0" : "") + now.getHours();
            var m = (now.getMinutes() < 10 ? "0" : "") + now.getMinutes();
            document.getElementById("w-status").innerHTML = "Cập nhật lúc: " + h + ":" + m;
          } catch (e) {
            setFallbackWeather();
          }
        } else {
          setFallbackWeather();
        }
      }
    };
    xhr.send();
  }

  function renderCurrentWeather(current) {
    document.getElementById("w-temp").innerHTML = Math.round(current.temperature_2m) + "°C";
    document.getElementById("w-feel").innerHTML = Math.round(current.apparent_temperature) + "°C";
    document.getElementById("w-hum").innerHTML = current.relative_humidity_2m + "%";
    document.getElementById("w-wind").innerHTML = Math.round(current.wind_speed_10m) + " km/h";
    
    var wInfo = decodeWeatherCode(current.weather_code);
    document.getElementById("w-icon").innerHTML = wInfo.icon;
    document.getElementById("w-desc").innerHTML = wInfo.desc;
  }

  function renderForecast(daily) {
    var html = "";
    var shortDays = ["CN", "Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7"];

    for (var i = 1; i <= 4; i++) {
      if (!daily.time[i]) break;

      var parts = daily.time[i].split("-");
      var fDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      var dayName = shortDays[fDate.getDay()] + " (" + parts[2] + "/" + parts[1] + ")";

      var info = decodeWeatherCode(daily.weather_code[i]);
      var maxT = Math.round(daily.temperature_2m_max[i]);
      var minT = Math.round(daily.temperature_2m_min[i]);
      var rainProb = daily.precipitation_probability_max[i];
      if (rainProb === null || rainProb === undefined) rainProb = 0;

      html += "<td>"
            + "<div class='f-day'>" + dayName + "</div>"
            + "<div class='f-icon'>" + info.icon + "</div>"
            + "<div class='f-temp'>" + maxT + "° <span class='f-temp-min'>/ " + minT + "°</span></div>"
            + "<div class='f-rain'>Mưa: " + rainProb + "%</div>"
            + "</td>";
    }
    document.getElementById("forecast-row").innerHTML = html;
  }

  function decodeWeatherCode(code) {
    if (code === 0) return { icon: "☀", desc: "Trời quang mây" };
    if (code === 1) return { icon: "🌤", desc: "Ít mây, nắng nhẹ" };
    if (code === 2) return { icon: "⛅", desc: "Mây rải rác" };
    if (code === 3) return { icon: "☁", desc: "Trời nhiều mây" };
    if (code >= 45 && code <= 48) return { icon: "🌫", desc: "Có sương mù" };
    if (code >= 51 && code <= 55) return { icon: "🌦", desc: "Mưa phùn nhẹ" };
    if (code >= 61 && code <= 65) return { icon: "🌧", desc: "Có mưa rào" };
    if (code >= 71 && code <= 77) return { icon: "❄", desc: "Trời lạnh" };
    if (code >= 80 && code <= 82) return { icon: "🌧", desc: "Mưa rào lớn" };
    if (code >= 95) return { icon: "⛈", desc: "Mưa dông" };
    return { icon: "☁", desc: "Có mây" };
  }

  function setFallbackWeather() {
    document.getElementById("w-status").innerHTML = "Đang ngoại tuyến (Offline)";
    if (document.getElementById("w-temp").innerHTML === "--°C") {
      document.getElementById("w-desc").innerHTML = "Chưa có mạng";
    }
  }

  // =========================================================================
  // 5. KHỞI CHẠY & VÒNG LẶP ĐỊNH KỲ
  // =========================================================================
  function init() {
    updateTime();
    generateCalendar();
    updateQuote();
    fetchWeatherAndForecast();

    // Kiểm tra thời gian mỗi 60 giây
    setInterval(function() {
      updateTime();
      var now = new Date();
      if (now.getHours() === 0 && now.getMinutes() === 0) {
        generateCalendar();
      }
      if (now.getMinutes() === 0) {
        updateQuote();
      }
    }, 60000);

    // Tự động cập nhật thời tiết & dự báo mỗi 30 phút
    setInterval(fetchWeatherAndForecast, 1800000);

    // Tự động đảo màu màn hình 0.5 giây mỗi 3 giờ để khử lưu ảnh E-Ink
    setInterval(refreshEInkScreen, 10800000);
  }

  window.onload = init;
</script>
</body>
