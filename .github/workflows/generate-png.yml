name: Render Kindle Dashboard PNG

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'index.html'

permissions:
  contents: write

concurrency:
  group: kindle-render
  cancel-in-progress: false

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: 'Asia/Ho_Chi_Minh'
      SCREEN_WIDTH: 600
      SCREEN_HEIGHT: 800

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài font & ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-liberation imagemagick

      - name: Cài Playwright
        run: |
          npm init -y >/dev/null
          npm i playwright
          npx playwright install --with-deps chromium

      - name: Chụp ảnh (chờ dữ liệu tải xong)
        run: |
          cat > render.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({
              viewport: { width: 600, height: 800 },
              deviceScaleFactor: 1
            });
            await page.goto('file://' + process.cwd() + '/index.html');
            await page.waitForSelector('body[data-ready="1"]', { timeout: 40000 });
            await page.screenshot({ path: 'raw_dashboard.png' });
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
          node render.js

      - name: Chuyển PNG 8-bit Grayscale
        run: |
          convert raw_dashboard.png \
            -gravity center \
            -extent ${SCREEN_WIDTH}x${SCREEN_HEIGHT} \
            -colorspace Gray -depth 8 -alpha off \
            -define png:color-type=0 \
            -interlace none -strip \
            dashboard.png
          file dashboard.png

      - name: Lưu ảnh lên repo
        run: |
          git config user.email "actions@github.com"
          git config user.name "Kindle Bot"
          git add dashboard.png
          if ! git diff --staged --quiet; then
            git commit -m "Auto update Kindle dashboard PNG"
            git pull --rebase
            git push
          fi
